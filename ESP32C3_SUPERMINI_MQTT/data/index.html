    <h1> Update Firmware - Upload Bin File </h1>
  </span>
  <br />
  <form id='uploadForm' method='POST' action='/updatefirmwareSubmit' enctype='multipart/form-data'>
    <input type='file' name='update' accept='.bin'>
    <button type='submit' class='btn'>Update Firmware</button>
  </form>
  <div class='progress-container'>
    <div id='progressBar' class='progress-bar'>0%</div>
  </div>
  <div id='status'></div>
  <a href='/restart'>Restart</a>
  <br />
  <div><a style=" text-decoration:none" href="/uploadhtmlfiles">Upload Html Files </a></div>

</div>
<script>
  document.getElementById('uploadForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var formData = new FormData(this);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/updatefirmwareSubmit', true);
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) {
        var percent = Math.round((e.loaded / e.total) * 100);
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressBar').innerHTML = percent + '%';
        document.getElementById('status').innerHTML = 'Uploading: ' + percent + '%';
        document.getElementById('progressBar').style.backgroundColor = "#4caf50";
      }
    };
    xhr.onload = function () {
      if (xhr.status == 200) {
        document.getElementById('status').innerHTML = 'Update completed! Device will Re-Start automatically............';
        // Reload the page after 10 seconds
        setTimeout(function () {
          location.reload();
        }, 10000); // 10,000 ms = 10 seconds
      } else {
        document.getElementById('status').innerHTML = 'Error: ' + xhr.responseText;
      }
    };
    xhr.send(formData);
  });
</script>

<script>
  function updateTime() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');

    // Format the time as HH:MM:SS
    const timeString = `${hours}:${minutes}:${seconds}`;

    // Display the time in the HTML element
    document.getElementById('time').textContent = timeString;
  }

  // Update time immediately
  updateTime();

  // Update time every second (1000 milliseconds)
  setInterval(updateTime, 1000);
</script>


<script>
  document.addEventListener("DOMContentLoaded", function () {
    setInterval(loadConfigDetails(), 1000 * 10);

  });

  document.addEventListener("DOMContentLoaded", function () {
    // Get the form element
    const form = document.getElementById("configForm");

    // Add a submit event listener to the form
    form.addEventListener("submit", function (event) {
      event.preventDefault(); // Prevent the default form submission

      // Create a FormData object to capture form data
      const formData = new FormData(form);

      // Convert the FormData object to a URL-encoded string
      const formParams = new URLSearchParams(formData).toString();

      // Send a POST request with form data as x-www-form-urlencoded
      fetch("/save_config", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded", // Send data as x-www-form-urlencoded
        },
        body: formParams, // Use URL-encoded string as the body
      })
        .then(response => {
          if (response.ok) {
            return response.text(); // Assuming the server responds with HTML
          } else {
            throw new Error("Network response was not ok.");
          }
        })
        .then(data => {
          // Handle successful response here
          console.log("Success:", data);
          alert("Configuration saved successfully!");
        })
        .catch(error => {
          // Handle errors here
          console.error("Error:", error);
          alert("There was an error saving the configuration.");
        });
    });
  });

</script>
